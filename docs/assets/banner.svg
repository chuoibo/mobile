<svg xmlns="http://www.w3.org/2000/svg" viewBox="0,0,1200,280" width="1200" height="280" role="img" aria-label="Rủ Đi — AI đi chơi, chia bill thông minh">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fc7b37"/>
      <stop offset="1" stop-color="#e75262"/>
    </linearGradient>
    <clipPath id="panel"><rect width="1200" height="280" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1200" height="280" fill="url(#brand)"/>
    <!-- soft depth, not decoration for its own sake: keeps the flat gradient from banding -->
    <circle cx="1080" cy="-40" r="220" fill="#ffffff" opacity=".10"/>
    <circle cx="1160" cy="300" r="180" fill="#ffffff" opacity=".08"/>
    <circle cx="640" cy="300" r="150" fill="#ffffff" opacity=".05"/>
  </g>

  <!-- logo squircle -->
  <rect x="64" y="74" width="132" height="132" rx="40" fill="#ffffff" opacity=".97"/>
  <text x="130" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="44" fill="#c93900">Rủ</text>
  <text x="130" y="176" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="44" fill="#c93900">Đi</text>

  <!-- wordmark -->
  <text x="236" y="132" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="72" fill="#ffffff">Rủ Đi</text>
  <text x="240" y="176" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="25" fill="#ffffff" opacity=".95">AI đi chơi, chia bill thông minh</text>
  <text x="240" y="212" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" fill="#ffffff" opacity=".8">Rủ nhau đi chơi → ăn uống → chia bill → thu tiền về. Một app, một vòng lặp.</text>

  <!-- three functional tones: colour carries meaning here, it is not styling -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5">
    <rect x="846" y="62" width="290" height="46" rx="23" fill="#ffffff" opacity=".18"/>
    <circle cx="874" cy="85" r="9" fill="#ffffff"/>
    <text x="894" y="90" fill="#ffffff">Cam · thương hiệu &amp; hành động</text>

    <rect x="846" y="117" width="290" height="46" rx="23" fill="#ffffff" opacity=".18"/>
    <circle cx="874" cy="140" r="9" fill="#7fe6da"/>
    <text x="894" y="145" fill="#ffffff">Teal · tiền &amp; quyết toán</text>

    <rect x="846" y="172" width="290" height="46" rx="23" fill="#ffffff" opacity=".18"/>
    <circle cx="874" cy="195" r="9" fill="#cbb4ff"/>
    <text x="894" y="200" fill="#ffffff">Tím · do AI sinh, người sửa được</text>
  </g>
</svg>
