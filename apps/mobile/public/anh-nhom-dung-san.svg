<svg xmlns="http://www.w3.org/2000/svg" width="320" height="400" viewBox="0 0 320 400" role="img" aria-label="Anh dung san, khong phai nguoi that">
  <!-- A drawn stand-in for a group photograph, used ONLY by the ?man=nhan-mat
       scan door in App.tsx. It is not a photograph and must never be replaced
       by one: a picture of a group of people is exactly the class of file this
       repo has a standing rule never to commit, and a scan door that needed
       real faces to demonstrate a face-box overlay would be arguing for the
       exception on the one subject that has none.

       The three shapes sit under the three boxes the door passes in, so the
       screenshot shows whether the overlay lands where the frame says. Drawn
       against a blank rectangle it would only show that the boxes render. -->
  <rect width="320" height="400" fill="#c7d2cc"/>
  <rect y="300" width="320" height="100" fill="#b3c0ba"/>
  <circle cx="61" cy="132" r="34" fill="#8ea79a"/>
  <circle cx="160" cy="104" r="32" fill="#7f9a8d"/>
  <circle cx="251" cy="146" r="33" fill="#93aa9e"/>
  <text x="160" y="368" font-family="sans-serif" font-size="15" fill="#3f4f47" text-anchor="middle">Anh dung san</text>
</svg>
