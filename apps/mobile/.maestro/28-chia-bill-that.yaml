# Chia hóa đơn THẬT (M5): nhập tay hai món (máy chủ không có khoá đọc bill thì
# đường nhập tay vẫn phải đủ), máy chủ giữ bill và bản gán, máy chủ chia, ghi
# vào sổ, quyết toán đọc từ sổ. Chạy sau flow 27 (phiên của D còn sống; nếu app
# ở màn chào thì đăng nhập lại bằng số D). Nhóm «Hoi QA» có C («An QA») và D
# («Ban QA»). Harness kiểm máy chủ sau flow: GET /contexts/{ctx}/balances có
# một khoản chuyển C → D đúng số.
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow:
    when:
      visible: "Rủ Đi thôi!"
    file: _dang-nhap-d.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Tạo mới"
- extendedWaitUntil:
    visible: "Chia hóa đơn"
    timeout: 30000
- tapOn: "Chia hóa đơn"
- extendedWaitUntil:
    visible: "Nhập tay"
    timeout: 60000
- assertNotVisible: "Dữ liệu demo"
- takeScreenshot: 28-bat-dau
- tapOn: "Nhập tay"
- extendedWaitUntil:
    visible: "Ô tên món 1"
    timeout: 30000
- tapOn: "Ô tên món 1"
- inputText: "Bun bo"
- hideKeyboard
- tapOn: "Ô tiền món 1"
- inputText: "150000"
- hideKeyboard
- tapOn: "Thêm món"
- extendedWaitUntil:
    visible: "Ô tên món 2"
    timeout: 30000
- tapOn: "Ô tên món 2"
- inputText: "Nuoc"
- hideKeyboard
- tapOn: "Ô tiền món 2"
- inputText: "50000"
- hideKeyboard
- assertVisible: "2 món · 200.000đ"
# Bill gõ tay nói là gõ tay; «Chưa nhận diện được món nào» dưới hai món vừa gõ đọc như thất bại.
- assertVisible: "Bạn nhập tay 2 món.*"
- takeScreenshot: 28-xem-lai
# Cuộn hết trang: nút bước phải nằm trên thanh cử chỉ nhờ inset đáy (ở font 1.3 nội dung dài hơn màn).
- scroll
- takeScreenshot: 28-xem-lai-cuoi
- tapOn: "Tiếp: ai dùng món nào?"
# Máy chủ đã giữ bill; mặc định mọi người cùng dùng mọi món. Nước chỉ D uống.
- extendedWaitUntil:
    visible: "Ai dùng món nào?"
    timeout: 60000
# Chevron thanh đầu lùi một bước trong luồng (không rời route): bill gõ tay còn nguyên.
- tapOn: "Quay lại"
- extendedWaitUntil:
    visible: "Xem lại hóa đơn"
    timeout: 30000
- assertVisible: "Bước 2/5"
- assertVisible: "Bun bo"
- takeScreenshot: 28-lui-mot-buoc
- tapOn: "Tiếp: ai dùng món nào?"
- extendedWaitUntil:
    visible: "Ai dùng món nào?"
    timeout: 60000
- assertVisible: "An QA · Nuoc"
- tapOn: "An QA · Nuoc"
- takeScreenshot: 28-gan-mon
- tapOn: "Xem kết quả"
# Máy chủ chia: Bún bò 150.000 chia đôi, nước 50.000 riêng D → C 75.000, D 125.000.
- extendedWaitUntil:
    visible: "Phần của mỗi người"
    timeout: 60000
- assertVisible: "75.000đ"
- assertVisible: "125.000đ"
- assertVisible: "Người trả Ban QA"
# Người trả (D, mặc định là người đang dùng máy) có huy hiệu ngay trên hàng của mình.
- assertVisible: "Đã trả bill"
- takeScreenshot: 28-ket-qua
- tapOn: "Ô tên khoản chi"
- inputText: "Toi Xom Lao"
- hideKeyboard
- tapOn: "Ghi vào sổ"
- extendedWaitUntil:
    visible: "Đã ghi: Toi Xom Lao"
    timeout: 60000
- assertVisible: "200.000đ, Ban QA đã trả.*"
- takeScreenshot: 28-da-ghi
- tapOn: "Xem quyết toán"
# Quyết toán sống đọc /contexts/{ctx}/balances: C chuyển cho D 75.000đ.
- extendedWaitUntil:
    visible: "Quyết toán chuyến đi"
    timeout: 60000
- extendedWaitUntil:
    visible: "75.000đ"
    timeout: 60000
# Tổng theo chuyến: kèo «Keo QA» (flow 27) đang đi hôm nay, bill vừa ghi rơi vào ngày của nó.
# Máy chủ trả 0 ở tổng các chuyến đã kết thúc; màn không được in 0đ làm «tổng chi tiêu».
- assertVisible: "Chi tiêu chuyến Keo QA.*"
- assertVisible: "200.000đ"
- assertNotVisible: "Tổng chi tiêu.*"
- assertNotVisible: "Dữ liệu demo"
- assertNotVisible: "3.840.000đ"
- takeScreenshot: 28-quyet-toan
