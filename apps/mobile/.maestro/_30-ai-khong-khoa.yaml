# Nhánh của flow 30 khi máy chủ KHÔNG có khoá mô hình (AI=0): lời gọi AI và
# /chia-bill đều nhận câu nói thật từ máy chủ, không im lặng vô danh.
appId: com.lakiet.rudi
---
- extendedWaitUntil:
    visible: "Rủ Đi AI chưa nối được mô hình trên máy chủ này."
    timeout: 60000
- hideKeyboard
- takeScreenshot: 30-ai-im-lang-that
- tapOn: "Ô soạn tin"
- inputText: "/chia-bill"
- tapOn: "Gửi tin nhắn"
- extendedWaitUntil:
    visible: "Chia bill từ chat chưa sẵn sàng trên máy chủ này."
    timeout: 60000
- hideKeyboard
- takeScreenshot: 30-chia-bill-that
