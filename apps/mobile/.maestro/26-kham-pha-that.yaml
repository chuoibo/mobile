# Khám phá trên danh mục THẬT (M4): tab Khám phá đọc GET /places, lọc theo
# category của máy chủ, mở chi tiết địa điểm từ danh mục, lưu địa điểm lên máy
# chủ (PUT /people/me/saved-places/{id}). Chạy sau flow 25 (phiên của D còn
# sống; nếu app ở màn chào thì đăng nhập lại bằng số D). Harness kiểm máy chủ
# sau flow: D có đúng một địa điểm đã lưu.
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow:
    when:
      visible: "Rủ Đi thôi!"
    file: _dang-nhap-d.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Khám phá"
# Danh mục của máy chủ, không phải fixture: tên thật xuất hiện, tên mẫu không.
- extendedWaitUntil:
    visible: "Tiệm Nướng Xóm Lào"
    timeout: 60000
# Con số là của máy chủ (danh mục seed có 12 chỗ ở Đà Lạt; một stack đã nhập
# OpenStreetMap có hàng trăm), nên flow gác HÌNH DẠNG câu chứ không gác con số:
# tên thành phố phải là tên máy chủ vừa phục vụ, không phải chuỗi viết cứng.
- assertVisible: "[0-9]+ nơi ở Đà Lạt"
- assertNotVisible: "Xóm Lèo"
- assertNotVisible: "Mẫu minh hoạ.*"
- assertNotVisible: "Gợi ý mẫu.*"
- takeScreenshot: 26-danh-muc-that
# Lọc theo category của máy chủ.
- tapOn: "Cafe"
# Con số là của danh mục đang phục vụ: 3 trên stack seed, hàng chục trên stack
# đã nhập OpenStreetMap. Flow gác việc BỘ LỌC CÓ CẮN (số kết quả ít hơn tổng,
# và chỗ thuộc danh mục khác biến mất), không gác con số.
- extendedWaitUntil:
    visible: "[0-9]+ kết quả"
    timeout: 30000
- assertVisible: "Lưng Chừng Cafe"
- assertNotVisible: "Tiệm Nướng Xóm Lào"
- takeScreenshot: 26-loc-cafe
- tapOn: "Xóa lọc"
- extendedWaitUntil:
    visible: "[0-9]+ nơi ở Đà Lạt"
    timeout: 30000
# Gõ tên thì lọc ngay trên máy, không cần dấu («lung chung» ra «Lưng Chừng»).
#
# Chỗ được tìm phải nằm ở ĐIỂM ĐẾN ĐANG PHỤC VỤ. «Quán Ốc Dì Bé» của bộ seed
# nằm ở TP.HCM — trước M10 route trả cả mười hai dòng bất kể thành phố nên flow
# tìm thấy nó ở Đà Lạt, và đó chính là cái sai M10 sửa.
- tapOn: "Ô tìm địa điểm"
- inputText: "lung chung"
- hideKeyboard
- extendedWaitUntil:
    visible: "Lưng Chừng Cafe"
    timeout: 30000
# Tên riêng thì vẫn phải ra ĐÚNG một chỗ, kể cả trong danh mục hàng trăm dòng.
- assertVisible: "1 kết quả"
- takeScreenshot: 26-tim-ten
- tapOn: "Xóa lọc"
# Mở chi tiết từ danh mục: địa chỉ, giờ, giá của máy chủ; nút chỉ đường; lưu.
- extendedWaitUntil:
    visible: "Tiệm Nướng Xóm Lào"
    timeout: 30000
- tapOn: "Mở Tiệm Nướng Xóm Lào"
- extendedWaitUntil:
    visible: "Chỉ đường"
    timeout: 60000
- assertVisible: "27/1 Yersin.*"
# «mỗi người» chứ không phải «một người»: câu giá do `cauGia` dựng từ M9c, và
# nó nói «Chưa có giá» cho chỗ nhập từ OSM. Chỗ seed này có giá nên phải ra dải.
- assertVisible: ".*mỗi người"
- assertVisible: "Lưu địa điểm"
- takeScreenshot: 26-chi-tiet
# «Nên làm gì ở đây» (M12b): câu sinh lúc nhập từ tag của chính chỗ này, không
# phải mô hình viết lúc mở màn. Chỗ seed này ra «Ăn nướng» từ tên + category.
- scrollUntilVisible:
    element:
      text: "Nên làm gì ở đây"
    direction: DOWN
    timeout: 20000
- assertVisible: "Ăn nướng"
- takeScreenshot: 26-nen-lam-gi
# Cuộn tới cuối: nhận xét phải lên khỏi footer ghim, và footer vẫn bấm được.
- scrollUntilVisible:
    element:
      text: ".*nhận xét"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 26-chi-tiet-cuoi
- tapOn: "Lưu địa điểm"
- extendedWaitUntil:
    visible: "Đã lưu"
    timeout: 30000
- takeScreenshot: 26-da-luu
# Thanh đầu đã cuộn khỏi màn; nút back của hệ thống đưa về danh mục.
- back
- extendedWaitUntil:
    visible: "[0-9]+ nơi ở Đà Lạt"
    timeout: 30000
- assertVisible: "Bỏ lưu Tiệm Nướng Xóm Lào"
- takeScreenshot: 26-danh-muc-da-luu
# Tìm bằng câu: Enter gửi câu lên /places/search. Máy chủ không có khoá thì thẻ
# «Rủ Đi AI» nói thật là chưa đọc được; có khoá thì nói hiểu gì. Chụp sau khi hết «Đang đọc câu».
- scrollUntilVisible:
    element:
      text: "Ô tìm địa điểm"
    direction: UP
- tapOn: "Ô tìm địa điểm"
- eraseText
- inputText: "quan nuong cho 4 nguoi"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Rủ Đi AI|Rủ Đi AI hiểu câu.*"
    timeout: 60000
- extendedWaitUntil:
    notVisible: "Đang đọc câu.*"
    timeout: 60000
# Không hideKeyboard ở đây: sau Enter bàn phím đã đóng, hideKeyboard thành BACK và
# app ở tab gốc thoát ra launcher (lượt 13:50 chụp màn hình chờ của Android).
- takeScreenshot: 26-tim-cau
