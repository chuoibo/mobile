# PR claim: "welcome → «Tìm hiểu thêm» không skip auth, Google nói thật là chưa
# cấu hình, «Vào bản trải nghiệm» vào được (bảng mặc định chạy với
# EXPO_PUBLIC_RUDI_FIXTURE=1; flow 22 khẳng định cửa đó VẮNG khi không có cờ)".
appId: com.lakiet.rudi
---
- stopApp
- launchApp
# Dev client: tờ «This is the developer menu» hiện ở lần mở lạnh, che app.
- runFlow: _bo-qua-dev-menu.yaml
# Fired twice: on this shared emulator the first VIEW intent is sometimes
# dropped and Expo Go stays on its own home. The second is a no-op once the
# app is up. Cost one red run before it was added here too.
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 120000
- assertVisible: "Hẹn hội bạn. Rủ Đi lo phần còn lại."
- tapOn: "Tìm hiểu thêm"
- extendedWaitUntil:
    visible: "Tìm nơi hợp cả hội"
    timeout: 15000
# "Tìm hiểu thêm" must page the carousel, NOT enter the app.
- assertNotVisible: "Khám phá"
- takeScreenshot: 01-welcome-page2
- tapOn: "Rủ Đi thôi!"
- extendedWaitUntil:
    visible: "Chào bạn"
    timeout: 30000
- tapOn: "Tiếp tục với Google"
# Thật thà cho tới khi có client id (PR-BE4 + Google Cloud của Lead): nút nói
# nó chờ cấu hình, và chỉ đường sang số điện thoại — cửa đang mở.
- assertVisible: "Đăng nhập Google mở sau khi đội cấu hình OAuth. Số điện thoại dùng được ngay."
- takeScreenshot: 01-login-google-honest
- tapOn: "Vào bản trải nghiệm Team Đà Lạt"
- extendedWaitUntil:
    visible: "Cho Rủ Đi biết gu của bạn"
    timeout: 30000
- takeScreenshot: 01-personalization
