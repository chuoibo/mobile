# The screen against the ledger, in one run.
#
# Every other flow here checks the app against the fixture, which proves the app
# is self-consistent and nothing about whether it can show a real group's money.
# This one runs with `EXPO_PUBLIC_RUDI_ACTOR` / `EXPO_PUBLIC_RUDI_CONTEXT` pinned
# at a seeded group, so `src/rudi/nguon.ts` returns a live source and the
# settlement screen reads `GET /contexts/{id}/balances` and `/recap` instead of
# `fixtures.ts`.
#
# The numbers below are NOT typed from the mockup. They are what
# `scripts/seed_demo_data.py` produces on a fresh database, read back with curl
# in the same session that runs this flow:
#
#   GET /contexts/{ctx}/recap      -> split_total_vnd = 6785000
#   GET /contexts/{ctx}/balances   -> transfers[0] = Ngọc -> Minh, 453666
#   GET /contexts/{ctx}/members    -> 7 active
#   GET /people/{minh}/finance     -> spend 1063666, receivable 768000
#
# Both money screens are asserted in one walk on purpose. Wiring only one of
# them to the server recreates the exact defect this PR was opened about: two
# screens, two totals for one trip. It was measured happening here -- the
# settlement screen showed 6.785.000đ while finance still showed the fixture's
# 3.840.000đ in the same launch -- before this flow grew its second half.
#
# `scripts/mobile_native.sh` does not run this flow: it needs a seeded database
# and a pinned identity, which the plain gate deliberately does not have. Run it
# with `make mobile-native-live`.
appId: com.lakiet.rudi
---
- stopApp
- launchApp
# Dev client: tờ «This is the developer menu» hiện ở lần mở lạnh, che app.
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 150000
- tapOn: "Rủ Đi thôi!"
- extendedWaitUntil:
    visible: "Vào bản trải nghiệm Team Đà Lạt"
    timeout: 30000
- tapOn: "Vào bản trải nghiệm Team Đà Lạt"
- extendedWaitUntil:
    visible: "Tạo không gian của tôi"
    timeout: 30000
- tapOn: "Tạo không gian của tôi"
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 30000
# The badge that says "these numbers are made up" must be gone in live mode.
- assertNotVisible: "Dữ liệu demo"
- tapOn: "Cá nhân"
- scrollUntilVisible:
    element:
      text: "Tài chính của tôi"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Tài chính của tôi"
# Finance, from `GET /people/{id}/finance`. No fixture number may appear here.
- extendedWaitUntil:
    visible: "Tài chính của tôi"
    timeout: 30000
- assertVisible: "1.063.666đ"
- assertVisible: "768.000đ"
- assertVisible: "5 khoản chi trong 1 nhóm. Máy chủ tính lại từ sổ mỗi lần hỏi."
- assertNotVisible: "3.840.000đ"
- assertNotVisible: "493.750đ"
- takeScreenshot: 20-finance-live
- scrollUntilVisible:
    element:
      text: "Xem quyết toán"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Xem quyết toán"
- extendedWaitUntil:
    visible: "Quyết toán chuyến đi"
    timeout: 30000
# The server's own total, not one this app added up.
- assertVisible: "6.785.000đ"
- assertVisible: "Tổng chi tiêu (7 người)"
# The server's own minimal transfer set, with names from /members and not from
# the fixture roster -- "Ngọc" exists in the seed, not in fixtures.ts.
- assertVisible: "Ngọc → Minh"
- assertVisible: "453.666đ"
# And none of the fixture story may be on this screen.
- assertNotVisible: "3.840.000đ"
- assertNotVisible: "Xóm Lèo"
- assertNotVisible: "Minh Anh"
- takeScreenshot: 20-settlement-live
