# Ảnh địa điểm có giấy phép (M12): tấm ảnh và credit của nó không rời nhau.
#
# Flow này KHÔNG ghim tên một địa điểm nào. Ảnh đến từ Wikimedia Commons qua
# `scripts/import_place_photos.py`, và chỗ nào có ảnh là chuyện của lượt nhập,
# không phải của flow. Cái flow ghim là bất biến: trên màn Khám phá có ít nhất
# một thẻ mang dòng «Ảnh quanh đây: <tác giả> · <giấy phép>», bấm vào dòng ấy
# mở đúng chi tiết chỗ đó, và ở chi tiết có cả dải ảnh lẫn câu nói rõ ảnh chụp
# quanh đây chứ không phải ảnh do nơi ấy cung cấp.
#
# Vì thế flow này ĐỎ trên stack chưa nhập ảnh — đúng như nó phải thế. «Không có
# ảnh nào» và «có ảnh nhưng vẽ thiếu credit» là hai chuyện, và chỉ cái thứ hai
# là lỗi sản phẩm; log của harness nói rõ stack có bao nhiêu thẻ có ảnh
# (kiem_may_chu_sau_26) nên không đọc nhầm được.
#
# Chạy sau flow 26 và GIỮ phiên đang sống (nhịp 60 giây của OTP).
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow:
    when:
      visible: "Rủ Đi thôi!"
    file: _dang-nhap-d.yaml
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Khám phá"
- extendedWaitUntil:
    visible: "[0-9]+ nơi ở .*"
    timeout: 60000
# Thẻ có ảnh bìa mang credit ngay trong thẻ. Cuộn tới thẻ đầu tiên có nó.
- scrollUntilVisible:
    element:
      text: "Ảnh quanh đây:.*"
    direction: DOWN
    timeout: 40000
- takeScreenshot: 38-the-co-anh
# Bấm vào chính dòng credit: cả thẻ là một nút, nên cú bấm mở chi tiết chỗ đó.
- tapOn: "Ảnh quanh đây:.*"
- extendedWaitUntil:
    visible: "Chỉ đường"
    timeout: 60000
- assertVisible: "Ảnh có giấy phép chụp quanh đây.*"
# Dưới từng tấm trong dải: cùng một tiền tố với thẻ (TIEN_TO_ANH), rồi tác giả
# và giấy phép. Lượt 2 của bảng bắt đúng chỗ này: màn chi tiết khi ấy in
# «Prenn · CC BY-SA 4.0» — credit có, tiền tố thì không, tức hai màn nói hai
# kiểu về cùng một tấm ảnh.
- assertVisible: "Ảnh quanh đây: .* · .*"
# Khung vẽ ra mà ảnh không về là chuyện flow KHÔNG thấy được bằng chữ — lượt
# 2026-09-06 đi qua hết mọi assert với hai khung rỗng. `MediaSlot` nay nói ra,
# nên câu này là phép đo thật chứ không phải lời chúc.
- assertNotVisible: "Chưa tải được ảnh"
- takeScreenshot: 38-chi-tiet-co-anh
# Nguồn ảnh thứ hai (ADR-0017 §2.4): ảnh chính nhóm này chụp ở đây, chỉ người
# trong nhóm thấy. Harness đặt sẵn một tấm qua curl vào ĐÚNG chỗ flow vừa mở
# (`chuan_bi_anh_nhom_cho_38` đọc cùng `GET /places`, lấy chỗ đầu có ảnh bìa).
- scrollUntilVisible:
    element:
      text: "Ảnh của nhóm bạn"
    direction: DOWN
    timeout: 30000
- assertVisible: "Nhom minh tung o day"
# Maestro khớp TRỌN văn bản của node, và node ấy là cả câu
# «Ảnh nhóm bạn chụp ở đây. Người ngoài nhóm không thấy.» — mẫu bắt đầu
# bằng vế sau sẽ không khớp dù chữ hiện rành rành trên ảnh chụp.
- assertVisible: ".*Người ngoài nhóm không thấy.*"
- assertNotVisible: "Chưa tải được ảnh"
- takeScreenshot: 38-anh-cua-nhom
