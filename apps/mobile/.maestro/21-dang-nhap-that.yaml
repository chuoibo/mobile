# Cửa vào thật, trên giao diện thật, ở chế độ prod.
#
# Mọi flow khác trong thư mục này đi vòng qua cửa đăng nhập: bảng mặc định dùng
# fixture, còn `20-du-lieu-that` ghim sẵn một danh tính vào bundle bằng
# `EXPO_PUBLIC_RUDI_*`. Không cái nào chạm đường mà NGƯỜI THẬT đi.
#
# Lượt này không ghim gì. `scripts/mobile_native.sh --dang-nhap` mint phiên đầu
# tiên bằng `genesis_session.py`, tạo nhóm + chuyến + một lời mời ĐÍCH DANH qua
# HTTP, rồi MỞ APP BẰNG CHÍNH CÁI LINK MỜI — giống hệt lúc một người bấm vào
# link bạn gửi. API chạy KHÔNG có `MOBILE_AUTH_MODE`, tức `prod`: nó không tin
# `X-Actor-*`, nên nếu app chưa thật sự cầm bearer thì mọi thứ sau đây là 401.
#
# Flow không tự mở link: `${...}` trong `openLink` không được Maestro thay, và
# `$`/`{`/`}` trong URL đẩy app vào màn lỗi. Hệ điều hành giao link, Maestro chỉ
# khẳng định.
#
# Chạy bằng:
#   MOBILE_DATABASE_URL=... make mobile-native-dangnhap API=<cổng>
appId: host.exp.exponent
---
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Bạn được rủ đi"
    timeout: 150000
# Mã đi theo link, người dùng không phải gõ lại.
- assertVisible: "Nhận lời mời"
- takeScreenshot: 21-man-nhan-loi-moi
- tapOn: "Nhận lời mời"
- extendedWaitUntil:
    visible: "Đã đăng nhập"
    timeout: 60000
# Hai câu, không phải một chữ «thành công». Đăng nhập KHÁC vào nhóm: người vừa
# nhận lời mời đầu tiên là `invited`, và máy chủ còn từ chối dữ liệu nhóm của họ.
- assertVisible: "Đã đăng nhập. Bạn được mời đích danh, nên chỉ cần bạn đồng ý là vào nhóm."
- assertNotVisible: "Xong, bạn đã ở trong nhóm"
# Và câu SAI cũ phải chết hẳn. Nó bảo người ta ngồi đợi một lượt duyệt không bao
# giờ tới, ngay cạnh cái nút cho họ vào ngay.
- assertNotVisible: "Nhóm còn phải duyệt"
- takeScreenshot: 21-da-dang-nhap-cho-dong-y

# Bước từng KHÔNG TỒN TẠI. Trước `membership_id`, người được mời dừng ở đây vĩnh
# viễn: không màn nào biết tên cái thẻ thành viên để mà bấm. Đây là chỗ «đăng
# nhập được» trở thành «dùng được».
- assertVisible: "Đồng ý vào nhóm"
- tapOn: "Đồng ý vào nhóm"
- extendedWaitUntil:
    visible: "Xong, bạn đã ở trong nhóm"
    timeout: 60000
- assertVisible: "Đã đăng nhập. Bạn đã ở trong nhóm."
- takeScreenshot: 21-da-vao-nhom

# Và vào tới nơi thật. Nhóm này vừa được dựng qua HTTP nên nó RỖNG — đó chính là
# điều đáng khẳng định: số của fixture không được phép xuất hiện ở đây. Một app
# rơi về fixture sau khi đăng nhập trông y hệt một app chạy đúng, chỉ khác là nó
# đang kể chuyện của tám người không có thật.
- tapOn: "Vào nhóm"
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- assertNotVisible: "Dữ liệu demo"
- assertNotVisible: "3.840.000đ"
- assertNotVisible: "Xóm Lèo"
- takeScreenshot: 21-trong-nhom-that
