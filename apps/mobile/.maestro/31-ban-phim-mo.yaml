# Mở bàn phím trong chat và DỪNG — không hideKeyboard. Harness --otp chạy
# `scripts/do_ban_phim.py` ngay sau flow này để đo hình học: ô soạn và bong bóng
# cuối phải nằm trên mép IME. Flow chỉ dựng trạng thái; phép đo là của script.
# Chạy sau flow 30 (C có nhóm «Hoi QA» và đã có tin trong đó).
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow: _dang-xuat-neu-co.yaml
- tapOn: "Rủ Đi thôi!"
- extendedWaitUntil:
    visible: "Chào bạn"
    timeout: 30000
- tapOn: "Ô số điện thoại"
- inputText: "${OTP_PHONE_C}"
- hideKeyboard
- tapOn: "Gửi mã"
- extendedWaitUntil:
    visible: "Nhập mã 6 số"
    timeout: 60000
- tapOn: "Ô nhập mã"
- inputText: "${OTP_CODE}"
- extendedWaitUntil:
    visible: "Khám phá"
    timeout: 60000
- tapOn: "Tin nhắn"
- extendedWaitUntil:
    visible: "Hoi QA"
    timeout: 60000
- tapOn: "Hoi QA"
- extendedWaitUntil:
    visible: "Ô soạn tin"
    timeout: 60000
- tapOn: "Ô soạn tin"
- inputText: "dang go"
# Bàn phím đang mở. Dừng ở đây.
- takeScreenshot: 31-ban-phim-mo
