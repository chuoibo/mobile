# Phiên OTP phải sống qua lần tắt app, và đăng xuất phải giết nó thật.
#
# Ba lần mở lạnh, ba câu trả lời khác nhau của cùng một cửa vào:
#   1. chưa có phiên     → màn chào;
#   2. có phiên          → THẲNG vào (ở đây là «Chưa có nhóm nào», vì người này
#                          chưa có nhóm), không qua màn chào;
#   3. sau khi đăng xuất → màn chào lại, và ở lại đó sau một lần tắt nữa.
# Quyết định đó là `manDau` trong src/rudi/duong-vao.ts, chạy sau khi
# SecureStore đã trả lời — cái đợi đó là thứ flow này đo được mà test node
# không đo được.
appId: com.lakiet.rudi
---
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- assertNotVisible: "Fetch development servers"
- extendedWaitUntil:
    visible: "Rủ Đi thôi!|Khám phá|Chưa có nhóm nào"
    timeout: 150000
- runFlow: _dang-xuat-neu-co.yaml
- tapOn: "Rủ Đi thôi!"
- extendedWaitUntil:
    visible: "Chào bạn"
    timeout: 30000
- tapOn: "Ô số điện thoại"
- inputText: "${OTP_PHONE_B}"
- hideKeyboard
- tapOn: "Gửi mã"
- extendedWaitUntil:
    visible: "Nhập mã 6 số"
    timeout: 60000
- tapOn: "Ô nhập mã"
- inputText: "${OTP_CODE}"
- runFlow:
    file: _bo-qua-so-thich.yaml
- extendedWaitUntil:
    visible: "Chưa có nhóm nào"
    timeout: 60000
# Lần mở lạnh thứ hai: có phiên, đi thẳng.
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Chưa có nhóm nào"
    timeout: 150000
- assertNotVisible: "Rủ Đi thôi!"
- assertNotVisible: "Chào bạn"
- takeScreenshot: 23-phien-song-qua-lan-tat
- tapOn: "Đăng xuất"
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 30000
# Lần mở lạnh thứ ba: phiên đã bị xoá thật, không phải chỉ điều hướng về chào.
- stopApp
- launchApp
- runFlow: _bo-qua-dev-menu.yaml
- extendedWaitUntil:
    visible: "Rủ Đi thôi!"
    timeout: 150000
- assertNotVisible: "Chưa có nhóm nào"
- takeScreenshot: 23-dang-xuat-ben-qua-lan-tat
