name: PostgreSQL Repository

# The 293 cases here are the only proof this repository has of any SQL, index,
# view or trigger -- the fake repository in `tests/api/` cannot see one of them.
# Running them only after a merge means a broken persistence layer is found on
# main, by whoever pulls next. `pull_request` was dropped in 1e7e65b to cut
# Actions minutes; that trade put the most expensive-to-diagnose tier of the
# suite behind the merge instead of in front of it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: postgres-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-postgres:
    name: repository on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mobile_test
          POSTGRES_USER: mobile
          POSTGRES_PASSWORD: mobile-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobile -d mobile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MOBILE_TEST_DATABASE_URL: postgresql+psycopg://mobile:mobile-test-only@localhost:5432/mobile_test
      MOBILE_REQUIRE_POSTGRES_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned API test dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Delegates so CI and `scripts/gate.sh postgres` cannot define "the live
      # tier" two different ways. They already had: this step said
      # `pytest tests/postgres` and the sixteen live cases three lanes put
      # under `tests/qa/` were in neither, skipping on every run and exiting 0.
      # MOBILE_TEST_DATABASE_URL is set above, so the runner uses the service
      # container and provisions nothing -- no Docker-in-Docker here.
      - name: Migrate an isolated schema and exercise the real repository
        run: scripts/postgres_tier.sh -q
