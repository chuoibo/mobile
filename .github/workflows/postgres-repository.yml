name: PostgreSQL Repository

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: postgres-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-postgres:
    name: repository on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mobile_test
          POSTGRES_USER: mobile
          POSTGRES_PASSWORD: mobile-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobile -d mobile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MOBILE_TEST_DATABASE_URL: postgresql+psycopg://mobile:mobile-test-only@localhost:5432/mobile_test
      MOBILE_REQUIRE_POSTGRES_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned API test dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrate an isolated schema and exercise the real repository
        working-directory: services/api
        run: python -m pytest tests/postgres -q
