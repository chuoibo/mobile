name: test

# Runs on every pull request and on main. Before this existed, CI checked only
# the repo guard, so 4214 subtests sat in the repository without ever gating
# anything -- and two bugs got merged that the suite would have caught: a
# migration that could not compile, and 12,629 dependency files.
#
# `pull_request` was removed in 1e7e65b to cut Actions minutes and restored
# here, because what it actually cut was the gate on the one event where a
# person makes an irreversible decision. Between the two commits every
# pull-request run in this repository was the repo guard and nothing else --
# 90 of them -- while the suite, ruff, the bundle, the image and the 293
# PostgreSQL cases ran only after the merge, reporting defects already on main.
# `tests/test_workflows_gate_pull_requests.py` holds the line.
#
# This does not double the spend: with `push` restricted to main, a commit on a
# branch fires the pull_request run only, and `concurrency` below cancels the
# superseded one.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ruff has been configured in services/api/pyproject.toml the whole time and
  # called by nothing, so the debt grew unwatched: 26 lint errors and 76
  # misformatted files by the day this job landed. A whole-tree gate cannot be
  # landed -- it is red on the commit that adds it, and the only way to green
  # it is to reformat 76 files, which buries every real diff underneath it.
  # This checks the files in the diff instead. Old debt stays visible to anyone
  # who runs ruff by hand; it just cannot grow any more.
  lint:
    name: ruff on changed files
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        # fetch-depth: 0 or there is no merge base to diff against, and the
        # script would exit 2 rather than guess.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned ruff
        # Read the pin out of requirements-dev.txt rather than repeating the
        # version here. Two copies drift, and a lint gate running a different
        # ruff than developers have is a gate that fails for reasons nobody can
        # reproduce locally.
        run: |
          set -euo pipefail
          pin="$(grep -E '^ruff==' services/api/requirements-dev.txt)"
          if [ -z "$pin" ]; then
            echo "::error::no ruff== pin in services/api/requirements-dev.txt"
            exit 1
          fi
          echo "installing $pin"
          python -m pip install --quiet "$pin"

      - name: Check the files this pull request changes
        if: github.event_name == 'pull_request'
        env:
          RUFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUFF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ruff_changed.sh "$RUFF_BASE_SHA" "$RUFF_HEAD_SHA"

      - name: Check the files this push changes
        # Same shape as the repo guard's push step, and for the same reason: a
        # brand-new branch reports an all-zero "before", and handing that over
        # would diff against the entire history and fail the author for every
        # file anyone has ever committed.
        if: github.event_name == 'push'
        env:
          RUFF_BASE_SHA: ${{ github.event.before }}
          RUFF_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$RUFF_BASE_SHA"
          if [ -z "${base//0/}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin main:refs/remotes/origin/main || true
            base="$(git merge-base refs/remotes/origin/main "$RUFF_HEAD_SHA" || true)"
          fi
          if [ -z "$base" ]; then
            # Nothing shared to compare against. Say so and check nothing --
            # but never silently, and never by scanning the tree, which would
            # fail on debt this push did not create.
            echo "::notice::no merge base, no changed-file set to lint"
            exit 0
          fi
          scripts/ruff_changed.sh "$base" "$RUFF_HEAD_SHA"

  api:
    name: api and domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements-dev.txt

      - name: Test
        run: python -m pytest services/api/tests tests -q

      - name: Every route the app calls exists
        # The two halves of a request are tested separately and never against
        # each other: the API suite calls the API, the mobile suite injects a
        # fake fetch. A path the client gets wrong is invisible to both.
        # Measured 2026-08-29 with `/batches/current/publish` put back into
        # src/api.ts: `tsc --noEmit` exited 0, `npm test` passed 493 of 493,
        # and this step is the only thing that goes red.
        #
        # An absent client is an absence and skipping is honest; a client that
        # is present is checked. Same rule as the mobile job below.
        run: |
          if [ ! -d apps/mobile/src ]; then
            echo "::notice::apps/mobile is not on this branch, skipping"
          else
            python scripts/check_api_contract.py
          fi

      - name: Every route the API declares is called by some screen
        # The other direction of the step above, and the one nothing asked
        # until 2026-08-30. A route no screen calls does not exist for a user:
        # it ships, it is tested, it is merged, and it is unreachable. Measured
        # on main at 8b6f847 -- 70 routes declared, 48 called, 5 belonging to
        # the guest page, 17 with no caller at all.
        #
        # The self-test runs first because this question was attempted twice by
        # hand the same day and got a different wrong answer each time:
        # substring matching called four dead routes alive, whole-string
        # matching called 32 live routes dead. Both are canaries in the script.
        run: |
          if [ ! -d apps/mobile/src ]; then
            echo "::notice::apps/mobile is not on this branch, skipping"
          else
            python scripts/check_server_routes_called.py --selftest
            python scripts/check_server_routes_called.py
          fi

      - name: Migration renders to DDL
        # No database needed. This is the check that was missing when five
        # foreign-key names ran past PostgreSQL's 63-character limit and the
        # migration could not compile at all.
        working-directory: services/api
        run: |
          python - <<'PY'
          import contextlib, io
          from alembic import command
          from alembic.config import Config
          config = Config("alembic.ini")
          config.set_main_option("sqlalchemy.url", "postgresql+psycopg://offline/offline")
          with contextlib.redirect_stdout(io.StringIO()):
              command.upgrade(config, "head", sql=True)
          print("migration renders")
          PY

  contract:
    name: client sends the headers the API demands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        # Same rule as `shared` below. `apps/mobile` absent is an absence and
        # skipping is honest; `apps/mobile` present with no `src` would make
        # the checker find zero call sites and report a clean tree, which is
        # the one reason this job must never be green.
        run: |
          if [ ! -d apps/mobile ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/mobile is not on this branch, skipping"
          elif [ -d apps/mobile/src ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::apps/mobile exists but src/ is missing -- refusing to skip"
            exit 1
          fi
      - if: steps.present.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.present.outputs.found == 'true'
        name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements-dev.txt
      - if: steps.present.outputs.found == 'true'
        name: The checker can be red
        # Before the real run, not after. A scanner that has lost its ability
        # to fail prints exactly what a clean tree prints.
        run: python3 scripts/check_actor_headers.py --selftest
      - if: steps.present.outputs.found == 'true'
        name: Every route wanting X-Actor-ID is called with it
        run: python3 scripts/check_actor_headers.py
      - if: steps.present.outputs.found == 'true'
        name: The CORS checker can be red
        # Two checkers in one job because they need the identical setup and
        # ask about the identical pair of files. They are two *stages* in
        # scripts/gate.sh, though, and that is the part worth keeping: the
        # questions are different, and folding two questions into one name is
        # how one of them stopped running once already -- see
        # tests/test_gate_stage_bodies_are_unique.py.
        run: python3 scripts/check_cors_contract.py --selftest
      - if: steps.present.outputs.found == 'true'
        name: Every header the client sends survives the CORS preflight
        run: python3 scripts/check_cors_contract.py

  screens:
    name: every screen is rendered by something
    # The third link in the chain the `api` job holds the first two of.
    # `client-routes` asks whether a path the app calls exists; `server-routes`
    # asks whether a declared route has a screen calling it. Neither asks
    # whether that screen is itself rendered by anything, so a screen can call
    # its routes correctly, typecheck, pass both, and be openable by nobody.
    #
    # It is a job of its own rather than a fifth step of `api` because it needs
    # neither the API source nor a single pip install: the checker is stdlib
    # Python reading apps/mobile only. Hanging it off `api` would put it behind
    # a dependency install and a full pytest run, so a red suite would stop it
    # answering a question that has nothing to do with the suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        # Same rule as `contract` above, with the sharper version of the
        # reason. `apps/mobile` absent is an absence and skipping is honest.
        # Present with no `src/screens` is a defect: with no screen file to
        # read, every screen is vacuously reachable, the run prints 0/0 and
        # exits 0 -- the green-because-nothing-ran shape, inside the very job
        # that exists to catch code nobody can reach.
        run: |
          if [ ! -d apps/mobile ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/mobile is not on this branch, skipping"
          elif [ -d apps/mobile/src/screens ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::apps/mobile exists but src/screens is missing -- 0/0 screens is not a pass"
            exit 1
          fi
      - if: steps.present.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.present.outputs.found == 'true'
        name: The checker can be red
        # Before the real run, not after, and here that ordering has already
        # paid for itself. The first draft let an entry file's plain imports
        # carry the chain, which marked every screen App.tsx merely imports as
        # reachable: deleting the real `<ChiaSe />` render left the check
        # GREEN. Three canaries hold that line -- a dead screen that must be
        # red, an imported-but-never-rendered screen that must be red, and a
        # live tree that must stay green.
        run: python3 scripts/check_screens_reachable.py --selftest
      - if: steps.present.outputs.found == 'true'
        name: Every screen against the render graph from the entry point
        run: python3 scripts/check_screens_reachable.py

  docker:
    name: api image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Base images are pinned by digest
        # A tag is mutable: `python:3.12-slim` gets re-pushed upstream and the
        # same commit then builds a different runtime. Checked before the build
        # so the failure names the cause instead of surfacing later as an
        # unexplained behaviour change.
        run: scripts/check_dockerfile_pinning.sh services/api/Dockerfile

      - name: Build
        # Unconditional on purpose: services/api/Dockerfile is on main, so its
        # absence is a defect, not the branch-dependent absence that the two
        # jobs below skip for.
        working-directory: services/api
        run: docker build -t mobile-api:ci .

      - name: Runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id mobile-api:ci -u)
          echo "container uid = $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::image runs as root"
            exit 1
          fi

      - name: No test tooling in the runtime image
        # The runtime venv is built from pyproject's dependency list, not from
        # requirements-dev.txt. This is the check that the split held.
        run: |
          if docker run --rm --entrypoint sh mobile-api:ci -c "ls /venv/bin" | grep -qE '^(pytest|ruff)$'; then
            echo "::error::pytest or ruff shipped in the runtime image"
            exit 1
          fi
          echo "runtime venv carries no dev tooling"

      - name: The container actually serves /healthz
        # A built image is not a running one. `docker build` succeeding says
        # nothing about whether the process starts.
        #
        # No published host port on purpose. The first version of this step ran
        # `-p 8000:8000` and curled the host, which passes whenever *anything*
        # answers on that port -- it reported a healthy API on a machine where
        # the container had failed to start and an unrelated process held 8000.
        # Polling the container's own HEALTHCHECK cannot be satisfied by a
        # stranger, and it exercises the HEALTHCHECK instruction at the same
        # time.
        run: |
          docker run -d --name api mobile-api:ci
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            case "$status" in
              healthy)
                echo "container reported healthy after ${i}s"
                docker rm -f api >/dev/null
                exit 0
                ;;
              unhealthy)
                echo "::error::container went unhealthy"
                docker logs api
                docker rm -f api >/dev/null
                exit 1
                ;;
            esac
            if [ "$(docker inspect --format '{{.State.Running}}' api)" != "true" ]; then
              echo "::error::container exited before becoming healthy"
              docker logs api
              docker rm -f api >/dev/null
              exit 1
            fi
            sleep 1
          done
          echo "::error::container never became healthy"
          docker logs api
          docker rm -f api >/dev/null
          exit 1

      - name: Image size
        run: |
          size=$(docker image inspect mobile-api:ci --format '{{.Size}}')
          echo "::notice::api image size = $((size / 1024 / 1024)) MiB"

  # The two jobs below are skipped when their code is not on this branch.
  # Written unconditionally at first, which made CI red on main the moment it
  # merged: both targets live on a branch that has not landed yet. In a
  # monorepo a job for a package that is not there is not a failure, it is an
  # absence -- but it must be an absence the log states out loud, not a job
  # that quietly never ran.
  shared:
    name: shared money format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        # Absent and broken are different answers. A missing directory is an
        # absence and skipping is right; a directory that is there but has lost
        # the file this job runs is a defect, and skipping it would turn the
        # job green for the one reason it must never be green.
        run: |
          if [ ! -d packages/shared ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::packages/shared is not on this branch, skipping"
          elif [ -f packages/shared/money.test.mjs ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::packages/shared exists but money.test.mjs is missing -- refusing to skip"
            exit 1
          fi
      - if: steps.present.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - if: steps.present.outputs.found == 'true'
        name: Both surfaces agree on the same golden cases
        run: node packages/shared/money.test.mjs

  mobile:
    name: mobile bundle and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        # Same rule as the job above: skip an absence, fail a defect. The old
        # condition keyed on package-lock.json alone, so deleting the lockfile
        # would have silently turned every step below into a no-op and left
        # this job reporting green for an app nobody built.
        run: |
          if [ ! -d apps/mobile ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/mobile is not on this branch, skipping"
          elif [ -f apps/mobile/package-lock.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::apps/mobile exists but package-lock.json is missing -- refusing to skip"
            exit 1
          fi
      - if: steps.present.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - if: steps.present.outputs.found == 'true'
        working-directory: apps/mobile
        run: npm ci
      - if: steps.present.outputs.found == 'true'
        name: Types
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - if: steps.present.outputs.found == 'true'
        # `npm test` now bundles the app before it runs anything else, and that
        # order is the point. The app spent a day unable to start -- a screen
        # imported a file Metro would not resolve -- while every test passed
        # and the typecheck was clean, because the test tsconfig compiles three
        # logic modules and no screens. A green suite is not the app starting.
        #
        # The rest still holds: the client must never derive a split of its
        # own, and editing the roster must never move who paid onto a different
        # person. Both were real defects a typecheck sees nothing of.
        #
        # `MOBILE_REQUIRE_WEB_A11Y=1` is what makes the three render checks in
        # tests/vo-tab-web.test.mjs a gate rather than a decoration. They drive
        # a headless Chrome over the build `build:check` has just written, and
        # without the flag a runner with no browser skips them and the job
        # still reports green -- which is the exact shape of the hole they were
        # added to close: the opening screen scrolled sideways and all four
        # tabs were anonymous to a screen reader while every gate here passed.
        # GitHub's ubuntu image ships Chrome at /usr/bin/google-chrome. If that
        # ever stops being true this step fails and names the reason, which is
        # the honest outcome; set CHROME_BIN or add an install step then.
        name: App bundles, client never computes money, shell renders right
        working-directory: apps/mobile
        env:
          MOBILE_REQUIRE_WEB_A11Y: "1"
        run: npm test

      - if: steps.present.outputs.found == 'true'
        # The step above bundles, but only for web: `npm test` starts with
        # `build:check`, which is `expo export --platform web`. Web is the
        # smallest of the three targets and the least like what ships: on this
        # commit web comes to roughly 200 modules against roughly 590 for each
        # of iOS and Android, about a third of the native graph. Treat those as
        # magnitudes, not constants -- the exact count moves with Metro's cache
        # and with the runner, so a number quoted here is stale the week after.
        # The gap is the durable part. A native-only break -- a react-native
        # module with no web counterpart, an asset resolved per-platform --
        # leaves the web export perfectly green.
        #
        # This job was green through a stretch where apps/mobile could not
        # bundle at all: the screens imported ../../../../packages/shared/money.mjs,
        # Metro would not look above apps/mobile, and nothing here noticed,
        # because tsconfig.test.json compiles three logic files and not one
        # screen. Green tests and a clean typecheck are not an app that starts.
        #
        # The other half of why this lives here and not in package.json: the
        # gate above is one line of `scripts.test`, so editing that line takes
        # the gate away and leaves CI green. A workflow step cannot be removed
        # without showing up in this file's diff.
        #
        # Export for every platform, into RUNNER_TEMP so no artifact lands in
        # the checkout.
        name: The app bundles for native too, not just web
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo export --platform all --output-dir "$RUNNER_TEMP/expo-export"

  # The only job where the client and the server are both real.
  #
  # Every other job holds one side fixed and fakes the other: `api` runs on a
  # fake repository, `mobile` injects a fake fetch, `contract` and the route
  # check compare two files without executing either. A defect that lives in
  # the seam between them -- a body key the client spells differently from the
  # server, a field the server stopped returning -- is green in all of them.
  #
  # `apps/mobile/tests/e2e/vertical-slice.test.mjs` was written for exactly
  # that seam and then ran nowhere. Measured 2026-08-30 at 1649c16: `npm test`
  # prunes `tests/e2e` by construction, the mobile job above runs that same
  # `npm test`, and `grep -rn test:e2e` over every .yml, .sh, .py, .json and
  # .md in the repository found one definition in package.json and not one
  # caller. The hero path this product is being built to demonstrate was
  # checked when somebody remembered, and the QA reports record the times
  # nobody did.
  #
  # The work is in `scripts/e2e_slice.sh` rather than inline here for the
  # reason the whole gate exists: Actions has not started a job since 07:45Z on
  # 2026-08-29, so a step written only in YAML is a step that runs nowhere.
  # The script provisions its own PostgreSQL and its own uvicorn, pins
  # EXPO_PUBLIC_API_URL at them, and sets MOBILE_REQUIRE_E2E=1 so an
  # unreachable server is a failure rather than a skip.
  e2e:
    name: the vertical slice, client against a real API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - id: present
        # Same rule as the mobile job: skip an absence, fail a defect. The
        # slice going missing must never be the thing that turns this green.
        run: |
          if [ ! -d apps/mobile ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/mobile is not on this branch, skipping"
          elif [ -f apps/mobile/tests/e2e/vertical-slice.test.mjs ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::apps/mobile exists but the vertical slice is missing -- refusing to skip"
            exit 1
          fi

      - if: steps.present.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.present.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - if: steps.present.outputs.found == 'true'
        name: Install the API and its client
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements-dev.txt
          npm --prefix apps/mobile ci

      - if: steps.present.outputs.found == 'true'
        name: Fetch the database image the runner provisions from
        # The script refuses to pull: a gate whose runtime depends on the
        # network is a gate that goes red for reasons that are not the code.
        # On a laptop the image is already there because docker-compose.yml
        # uses the same tag; on a fresh runner it has to be fetched, and here
        # is the honest place to do it.
        run: docker pull postgres:16-alpine

      - if: steps.present.outputs.found == 'true'
        name: Propose, confirm, batch, publish, guest page, receipt
        run: scripts/e2e_slice.sh
