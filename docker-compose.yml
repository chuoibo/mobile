# Một tên project cho cả máy là CỐ Ý, không phải sơ suất. Máy này có năm
# worktree cùng trỏ vào một repo; nếu mỗi worktree tự sinh project riêng thì
# `make up` ở đây và `make up` ở kia tranh nhau cổng 8099, và cái link trang
# khách lane này in ra sẽ 404 ở lane kia vì nó nằm trong một database khác.
#
# Cái giá của lựa chọn đó: `docker compose down -v` từ BẤT KỲ thư mục nào cũng
# xoá volume của cả đội. Đó là lý do `make clean` bắt gõ đúng tên project ra
# mới chịu chạy — xem Makefile.
#
# Muốn một bộ container riêng (QA soi một PR, thử một migration bẩn) thì đặt
# MOBILE_PROJECT, đừng sửa dòng dưới:
#   MOBILE_PROJECT=qa47 MOBILE_API_PORT=8199 MOBILE_POSTGRES_PORT=5434 make up
# COMPOSE_PROJECT_NAME của compose vẫn đè lên được như thường lệ; MOBILE_PROJECT
# có mặt ở đây để `make` biết nó đang thao tác lên cái gì mà nói ra cho người
# dùng, thay vì đoán.
name: ${MOBILE_PROJECT:-mobile-local}

# Máy dev, không phải máy chủ. Mật khẩu ở đây là "mobile-dev-only" đúng nghĩa
# đen để không ai nhầm nó với thứ được phép rời khỏi máy này.
#
# Cổng phía host lấy từ biến môi trường vì 5432 là cổng bận nhất trên một máy
# dev. Người nào đã có Postgres riêng chỉ cần đặt MOBILE_POSTGRES_PORT=5433
# trong .env, không phải sửa file này rồi lỡ commit.
#
# API publish ra host ở **8099**, không phải 8000. Đó là con số duy nhất trong
# repo này mà người ta gõ tay: `apps/mobile/src/api.ts` fallback về
# `http://localhost:8099`, `scripts/phone_path.py` mặc định `--api-port 8099`,
# README ghi 8099. Bên trong container thì uvicorn vẫn nghe 8000 — cổng đó
# nằm trong mạng riêng của compose, không ai gõ nó, và giữ nguyên 8000 để
# `docker run mobile-local/api:dev` một mình vẫn cư xử đúng như Dockerfile
# khai (EXPOSE 8000, HEALTHCHECK 8000). Ánh xạ "8099:8000" đọc thẳng ra điều
# đó; đừng "sửa" vế phải cho khớp vế trái.

x-api-image: &api-image
  build:
    context: ./services/api
  # Cùng một tag cho ba service, nên ảnh chỉ dựng một lần; hai lần sau là
  # cache hit. Nếu để mỗi service tự đặt tên ảnh thì `make up` dựng ba lần.
  image: mobile-local/api:dev

x-api-env: &api-env
  # Tên host là `postgres` — tên service trong mạng compose. `localhost` ở đây
  # trỏ vào chính container, đó là lỗi số một khi bê URL từ .env của máy sang.
  MOBILE_DATABASE_URL: postgresql+psycopg://mobile:mobile-dev-only@postgres:5432/mobile
  # ADR-0014: `get_actor` mặc định KHÔNG tin `X-Actor-*` nữa. Stack này là máy
  # dev trên máy của chính mình, và `scripts/seed_dev_data.py` gọi API bằng
  # header actor, nên nó bật lại chế độ cũ — bật RÕ, ở đúng một chỗ, không phải
  # bằng cách để trống biến. Host phục vụ người thật không có dòng này và vì
  # thế chạy `prod`; đổi dòng này thành `prod` ở đây thì seed sẽ 401, đó là
  # hành vi đúng chứ không phải hỏng.
  MOBILE_AUTH_MODE: dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mobile
      POSTGRES_USER: mobile
      POSTGRES_PASSWORD: mobile-dev-only
    ports:
      - "${MOBILE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # `-h 127.0.0.1` không phải thừa. Trong lúc initdb, Postgres chạy một
      # server tạm chỉ nghe trên unix socket; `pg_isready` không có -h sẽ báo
      # "sẵn sàng" trong khi cổng TCP vẫn đóng. Service nào đợi
      # `service_healthy` lúc đó sẽ khởi động rồi chết vì connection refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U mobile -d mobile"]
      interval: 3s
      timeout: 3s
      start_period: 5s
      retries: 20
    volumes:
      - mobile-postgres-data:/var/lib/postgresql/data

  # Chạy một lần rồi thoát. API đợi nó thoát mã 0, nên schema luôn có trước
  # câu query đầu tiên — thay vì "API lên trước, sập, docker restart, may thì
  # lần thứ ba trúng".
  migrate:
    <<: *api-image
    # M9: the place catalogue is a table, so a fresh database has an empty one.
    # Seeding runs here, in the same one-shot container that migrates, so no
    # deployment can come up migrated-but-catalogue-less; the seeder is
    # idempotent and leaves rows an OSM import wrote alone.
    command:
      ["sh", "-c", "alembic upgrade head && python -m app.places.seed_catalog"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    command:
      ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *api-env
      # Compose forwards NOTHING from the host by itself: a variable crosses
      # into a container only because it is listed here. It was not, so every
      # stack `make up` built read bills with no credential -- and answered
      # `422 receipt_unreadable` in 2.5ms, which is what a blurry photo gets.
      # A misconfigured server that impersonates a bad photo is the worst way
      # for this to fail; see scripts/check_ai_key.sh for the rest of that.
      #
      # `:-` and not `:?`. An unset key must render an empty string rather
      # than break `docker compose config` for the whole repo -- the money
      # path does not need this key. Empty and absent take the same branch in
      # `vision_gemini.py`, so there is no third state to reason about.
      #
      # Listed on `api` alone, not in the `x-api-env` anchor: `migrate`,
      # `seed` and `demo` share that anchor and none of them read a bill. A
      # credential belongs in exactly the processes that use it.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # The key `people.id` is derived under (bug-140342). Same rule as the
      # line above: Compose forwards nothing by itself, so a key sitting in the
      # host's `.env` reaches the API only because it is named here. Unset, the
      # API answers 503 on sign-in rather than falling back to the unkeyed
      # digest that let group members read each other's telephone numbers.
      #
      # On `api` alone. `migrate` and `seed` share the `x-api-env` anchor and
      # neither derives an id: seeding uses fixed uuids straight out of
      # `scripts/seed_dev_data.py`. A secret belongs in exactly the processes
      # that use it.
      MOBILE_PERSON_ID_KEY: ${MOBILE_PERSON_ID_KEY:-}
      # Where uploaded photos land. Unset, `app/media/storage.py` falls back to
      # `$HOME/.local/share/rudi/media` -- inside the container's writable
      # layer, which `docker compose up --build` throws away. Measured on the
      # shared stack after one rebuild: `select count(*) from uploaded_images`
      # returned 4, `find ~/.local/share/rudi/media -type f` returned 0.
      #
      # That is a worse failure than losing both halves. Losing the rows too
      # would leave an empty memory wall, which reads as "nothing here yet".
      # Keeping the rows and dropping the files leaves a wall that LISTS
      # memories whose photos 404 forever.
      #
      # Pinned to a literal rather than `${...:-}`: the value must agree with
      # the mount target below, and a host that overrides one without the other
      # gets the silent-loss behaviour back. Someone who genuinely wants the
      # photos elsewhere edits both lines together, which is the point.
      MOBILE_MEDIA_ROOT: /var/lib/rudi/media
    volumes:
      # A named volume, NOT a bind mount into the source tree. Photos of real
      # bills must never be reachable from a path git can stage: the repo guard
      # fails closed on binaries, but a guard is a net, not a floor.
      #
      # The mount target exists in the image owned by uid 10001 (see the
      # Dockerfile). Without that, Docker creates this mount point as root and
      # every upload fails with EACCES.
      - mobile-media-data:/var/lib/rudi/media
    # Cố ý KHÔNG đặt MOBILE_PUBLIC_BASE_URL ở đây. `.env.example` có khai nó,
    # nhưng `grep -rn MOBILE_PUBLIC_BASE_URL services/` không ra dòng code nào
    # đọc: publish trả về `path` tương đối, người gửi tự ghép host. Đặt một
    # biến không ai đọc chỉ tạo ảo giác là nó có tác dụng.
    ports:
      - "${MOBILE_API_PORT:-8099}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Cùng một probe với HEALTHCHECK trong Dockerfile, chỉ dày nhịp hơn:
      # 30s/lần là đúng cho máy chủ, nhưng bắt `make up` đứng chờ nửa phút.
      # /healthz cố ý không chạm database (CLAUDE.md) — nó trả lời "tiến trình
      # này có phục vụ không", không phải "Postgres có sống không".
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)",
        ]
      interval: 2s
      timeout: 3s
      start_period: 3s
      retries: 30
    # Không mount source vào đây. Ảnh chạy phải là đúng ảnh đã dựng, nếu không
    # thì "chạy được trên máy tôi" quay lại qua cửa sau: code chạy từ bind
    # mount còn ảnh thì chưa ai chứng minh là dựng được.

  # Không nằm trong `docker compose up`: seed là thao tác có chủ đích, không
  # phải thứ chạy lén mỗi lần ai đó khởi động lại hệ. `make seed` gọi nó.
  seed: &seed-service
    <<: *api-image
    profiles: ["tools"]
    command: ["python", "/seed/seed_dev_data.py"]
    environment:
      <<: *api-env
      MOBILE_SEED_API_BASE_URL: http://api:8000
    volumes:
      # Script nằm ngoài build context của services/api nên phải mount. Chỉ
      # đọc: một fixture dev không có việc gì phải ghi vào cây nguồn.
      - ./scripts:/seed:ro
    depends_on:
      api:
        condition: service_healthy

  # Cùng một cách chạy với `seed`, khác đúng cái script. Tách ra thành service
  # riêng thay vì override command lúc gọi, để `docker compose config` đọc ra
  # được là có hai fixture — thứ chỉ tồn tại trong một dòng Makefile thì không
  # ai tìm thấy khi đi tìm.
  #
  # `seed` chứng minh hệ còn sống (3 người, 1 đợt). `demo` dựng bộ dữ liệu để
  # trình diễn: 7 người, 3 chuyến, còn nợ thật. Chạy được cả hai trên cùng một
  # database — chúng tạo hai nhóm khác nhau, không giẫm lên nhau.
  demo:
    <<: *seed-service
    command: ["python", "/seed/seed_demo_data.py"]

volumes:
  mobile-postgres-data:
  # Photos survive `up --build` because of this line and nothing else. Removing
  # it does not break a test that reads this file -- it breaks
  # `scripts/check_media_persists.sh`, which writes a photo in one container and
  # reads it back in another.
  mobile-media-data:
