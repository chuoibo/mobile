[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = %(here)s
path_separator = os
sqlalchemy.url = postgresql+psycopg://mobile:mobile-dev-only@localhost:5432/mobile

[loggers]
# `app` is here to keep migrating from silencing the application it migrates.
#
# `env.py` calls `logging.config.fileConfig`, whose `disable_existing_loggers`
# defaults to True: every logger that already exists and is not named in this
# file gets `disabled = True` for the rest of the process. Measured on
# 2026-08-29 in the postgres tier, one migration killed all eight `app.*`
# loggers that import order had created by then -- `app`, `app.api`,
# `app.api.routes`, `app.api.routes.places`, `app.api.service`, `app.places`,
# `app.places.reasons`, `app.places.search`.
#
# That is a silent failure twice over. In production, anything that migrates
# in-process before serving loses its application log. In the tests it is
# worse: the privacy cases assert `SECRET not in caplog.text`, and an empty
# channel satisfies that for the one reason it must not.
#
# Naming `app` fixes it at the root. fileConfig treats the descendants of a
# configured logger as child loggers rather than as strangers to switch off,
# so `app.*` survives. `level = NOTSET` and no handlers keep it inheriting
# exactly as before -- this section changes what migrating DESTROYS, not how
# the application logs.
keys = root,sqlalchemy,alembic,app

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

# NOTSET, no handlers, propagate: inherit whatever the application already had.
[logger_app]
level = NOTSET
handlers =
qualname = app
propagate = 1

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

